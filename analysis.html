<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cashflow — Analisis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body{font-family:Inter, sans-serif;background:#f8fafc} </style>
</head>
<body class="p-6">
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-semibold">Analisis Keuangan</h1>
      <a href="index.html" class="text-indigo-600">Kembali</a>
    </div>

    <div id="insights" class="grid grid-cols-1 gap-4">
      <div class="bg-white p-4 rounded-lg shadow-sm">
        <h2 class="font-semibold">Ringkasan</h2>
        <div id="summary" class="mt-2 text-sm text-slate-600"></div>
      </div>

      <div class="bg-white p-4 rounded-lg shadow-sm">
        <h2 class="font-semibold">Top Pengeluaran</h2>
        <ul id="topExpenses" class="mt-2 list-disc pl-5 text-sm text-slate-600"></ul>
      </div>

      <div class="bg-white p-4 rounded-lg shadow-sm">
        <h2 class="font-semibold">Rekomendasi</h2>
        <ul id="recommendations" class="mt-2 list-disc pl-5 text-sm text-slate-600"></ul>
      </div>

      <div class="bg-white p-4 rounded-lg shadow-sm">
        <h2 class="font-semibold">Analisis Tren (6 bulan)</h2>
        <div class="mt-3 text-sm text-slate-600">
          <div id="trendSummary">Memuat data...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const STORAGE_KEY = 'cf_transactions_v1';
    const summaryEl = document.getElementById('summary');
    const topEl = document.getElementById('topExpenses');
    const recEl = document.getElementById('recommendations');
    const trendEl = document.getElementById('trendSummary');

    let transactions = loadTransactions();
    render();

    function loadTransactions(){
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch(e) {
        console.error('Gagal membaca data transaksi:', e);
        return [];
      }
    }

    function render(){
      const totalIncome = transactions.filter(t=>t.type==='income').reduce((s,t)=> s + Number(t.amount), 0);
      const totalExpense = transactions.filter(t=>t.type==='expense').reduce((s,t)=> s + Number(t.amount), 0);
      summaryEl.innerHTML = `
        <div>Pendapatan total: <strong>${formatCurrency(totalIncome)}</strong></div>
        <div>Pengeluaran total: <strong>${formatCurrency(totalExpense)}</strong></div>
        <div>Saldo bersih: <strong>${formatCurrency(totalIncome - totalExpense)}</strong></div>
        <div class="mt-2 text-xs text-slate-400">Total dihitung dari semua transaksi yang tersimpan pada perangkat Anda.</div>
      `;

      // Top pengeluaran per kategori
      const byCategory = {};
      for (const t of transactions.filter(t=>t.type==='expense')){
        const cat = (t.category || 'Lainnya').trim();
        byCategory[cat] = (byCategory[cat] || 0) + Number(t.amount || 0);
      }
      const sorted = Object.entries(byCategory).sort((a,b)=> b[1] - a[1]).slice(0,5);
      if (sorted.length === 0) {
        topEl.innerHTML = '<li class="text-slate-500">Tidak ada pengeluaran</li>';
      } else {
        topEl.innerHTML = sorted.map(([k,v])=> `<li>${escapeHtml(k)} — ${formatCurrency(v)}</li>`).join('');
      }

      // Rekomendasi sederhana
      const recs = [];
      if (totalExpense > totalIncome) recs.push('Pengeluaran melebihi pemasukan. Pertimbangkan kurangi biaya variabel dan buat target tabungan.');
      else recs.push('Cashflow positif: pertahankan pola pengeluaran saat ini dan pertimbangkan diversifikasi tabungan/investasi.');
      if (sorted.length) recs.push(`Periksa kategori terbesar: ${sorted[0][0]}. Cari peluang penghematan pada kategori ini.`);
      recs.push('Buat anggaran bulanan dan pantau realisasi setiap minggu.');
      recEl.innerHTML = recs.map(r=> `<li>${escapeHtml(r)}</li>`).join('');

      // Tren 6 bulan sederhana: hitung pemasukan & pengeluaran per bulan
      const months = aggregateLastMonths(6);
      if (months.length === 0) {
        trendEl.textContent = 'Tidak ada data untuk analisis tren.';
      } else {
        const monthLines = months.map(m => `${m.label}: Pemasukan ${formatCurrency(m.income)}, Pengeluaran ${formatCurrency(m.expense)}`);
        const recent = months[months.length-1];
        const prev = months[months.length-2] || null;
        const trendNotes = [];
        if (prev) {
          const incomeDelta = recent.income - prev.income;
          const expenseDelta = recent.expense - prev.expense;
          trendNotes.push(`Bulan terakhir (${recent.label}): pemasukan ${formatChange(incomeDelta)}, pengeluaran ${formatChange(expenseDelta)} dibandingkan bulan sebelumnya.`);
        }
        trendEl.innerHTML = `<div class="text-sm">${monthLines.join('<br>')}</div><div class="mt-2 text-xs text-slate-500">${trendNotes.join(' ')}</div>`;
      }
    }

    function aggregateLastMonths(n=6){
      const now = new Date();
      const result = [];
      for (let i = n - 1; i >= 0; i--){
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
        result.push({ key, label: d.toLocaleString('id-ID', { month: 'short', year: 'numeric' }), income: 0, expense: 0 });
      }
      for (const t of transactions){
        const d = new Date(t.date);
        if (isNaN(d)) continue;
        const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
        const bucket = result.find(r => r.key === key);
        if (bucket){
          if (t.type === 'income') bucket.income += Number(t.amount || 0);
          else bucket.expense += Number(t.amount || 0);
        }
      }
      return result;
    }

    function formatCurrency(n){
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(Number(n) || 0);
    }
    function formatChange(n){
      if (n === 0) return 'tetap';
      return (n > 0 ? 'naik ' : 'turun ') + formatCurrency(Math.abs(n));
    }
    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  })();
  </script>
</body>
</html>
