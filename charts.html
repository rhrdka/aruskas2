<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cashflow — Grafik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style> body{font-family:Inter, sans-serif;background:#f8fafc} </style>
</head>
<body class="p-6">
  <div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-semibold">Grafik & Visualisasi</h1>
      <a href="index.html" class="text-indigo-600">Kembali</a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-lg p-4 shadow-sm">
        <h2 class="font-semibold mb-2">Pemasukan vs Pengeluaran (6 bulan)</h2>
        <div class="h-96">
          <canvas id="barChart"></canvas>
        </div>
      </div>

      <div class="bg-white rounded-lg p-4 shadow-sm">
        <h2 class="font-semibold mb-2">Saldo Kumulatif</h2>
        <div class="h-96">
          <canvas id="lineChart"></canvas>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-lg p-4 shadow-sm mt-6">
      <h2 class="font-semibold mb-2">Distribusi Pengeluaran per Kategori</h2>
      <div class="h-72">
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const STORAGE_KEY = 'cf_transactions_v1';
    let transactions = loadTransactions();
    let barChart = null, lineChart = null, pieChart = null;

    renderAll();

    function loadTransactions(){ try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; } catch(e){ return []; } }

    function aggregateMonths(months=6){
      const now = new Date();
      const result = [];
      for (let i = months - 1; i >= 0; i--){
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
        result.push({ key, label: d.toLocaleString('id-ID',{ month:'short', year:'numeric' }), income:0, expense:0 });
      }
      for (const t of transactions){
        const d = new Date(t.date);
        const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
        const bucket = result.find(r => r.key === key);
        if (bucket) {
          if (t.type === 'income') bucket.income += Number(t.amount); else bucket.expense += Number(t.amount);
        }
      }
      return result;
    }

    function renderAll(){
      renderBar();
      renderLine();
      renderPie();
    }

    function destroyIf(chart){
      if (!chart) return;
      try { chart.destroy(); } catch(e){}
    }

    function renderBar(){
      destroyIf(barChart);
      const ctx = document.getElementById('barChart').getContext('2d');
      const data = aggregateMonths(6);
      barChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.map(d=>d.label),
          datasets: [
            { label:'Pemasukan', data: data.map(d=>d.income), backgroundColor:'rgba(34,197,94,0.85)' },
            { label:'Pengeluaran', data: data.map(d=>d.expense), backgroundColor:'rgba(244,63,94,0.85)' }
          ]
        },
        options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } } }
      });
    }

    function renderLine(){
      destroyIf(lineChart);
      const ctx = document.getElementById('lineChart').getContext('2d');
      // saldo kumulatif per hari dalam 90 hari terakhir
      const days = 90;
      const start = new Date(); start.setDate(start.getDate() - days + 1);
      const dates = [];
      for (let i=0;i<days;i++){
        const d = new Date(start); d.setDate(start.getDate() + i);
        dates.push(d.toISOString().slice(0,10));
      }
      let cumulative = 0;
      const balances = dates.map(date => {
        const dayTx = transactions.filter(t => t.date === date);
        for (const t of dayTx) cumulative += (t.type === 'income' ? Number(t.amount) : -Number(t.amount));
        return cumulative;
      });

      lineChart = new Chart(ctx, {
        type: 'line',
        data: { labels: dates, datasets: [{ label:'Saldo Kumulatif', data: balances, borderColor:'rgba(59,130,246,0.85)', backgroundColor:'rgba(59,130,246,0.12)', fill:true }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ x:{ ticks:{ maxTicksLimit:10 } } } }
      });
    }

    function renderPie(){
      destroyIf(pieChart);
      const ctx = document.getElementById('pieChart').getContext('2d');
      // hitung kategori pengeluaran
      const map = {};
      for (const t of transactions.filter(t=>t.type==='expense')){
        const cat = t.category || 'Lainnya';
        map[cat] = (map[cat] || 0) + Number(t.amount);
      }
      const labels = Object.keys(map);
      const data = labels.map(l => map[l]);
      const colors = labels.map((_,i) => `hsl(${(i*47)%360} 70% 50%)`);

      if (labels.length === 0) {
        // kosong -> tampilkan placeholder
        ctx.clearRect(0,0,ctx.canvas.width, ctx.canvas.height);
        ctx.font = '14px Arial'; ctx.fillStyle = '#6b7280';
        ctx.fillText('Tidak ada pengeluaran untuk ditampilkan', 10, 50);
        return;
      }

      pieChart = new Chart(ctx, {
        type: 'pie',
        data: { labels, datasets:[ { data, backgroundColor: colors } ] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right' } } }
      });
    }

    // pastikan chart dihancurkan saat navigasi keluar
    window.addEventListener('beforeunload', ()=>{
      [barChart,lineChart,pieChart].forEach(c => { if (c) try { c.destroy(); } catch(e){} });
    });
  })();
  </script>
</body>
</html>
